services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nexa
      POSTGRES_USER: nexa
      POSTGRES_PASSWORD: nexa_dev
    ports: ["5432:5432"]
    volumes: [nexa_postgres:/var/lib/postgresql/data]
  backend:
    build: ./backend
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://nexa:nexa_dev@postgres:5432/nexa
      JWT_ACCESS_SECRET: development-secret-change-me-12345678901234567890
      JWT_REFRESH_SECRET: development-refresh-secret-change-me-1234567890
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 30d
      CORS_ORIGIN: http://localhost:5173
    ports: ["4000:4000"]
    depends_on: [postgres]
volumes:
  nexa_postgres:
